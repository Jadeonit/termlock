name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build TermLock.sln -c Release --nologo

      - name: Publish
        run: >
          dotnet publish src/TermLock/TermLock.csproj
          -c Release -r win-x64 --self-contained false
          -o artifacts/win-x64

      - name: Pack
        shell: pwsh
        run: Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/termlock-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: termlock-win-x64
          path: artifacts/termlock-win-x64.zip
